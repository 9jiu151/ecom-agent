name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://ecom-agent-v5gz.onrender.com/api/health || true)
          echo "health check -> $code"
